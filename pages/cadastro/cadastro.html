<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../cadastro/cadastro.css">
</head>

<body>
    <header>      
        <img src="../imagens/icon.png" width="200px" alt="">  
        <h1>
            Cadastro
        </h1>
    </header>

    <nav>
        <hr>
        <a href="../../index.html">Ir para home</a>
        <hr>
    </nav>

    <main>

        <form action="../../index.html" onsubmit="alert('usuario cadastrado')">

            <p>Email</p>
            <input type="email" placeholder="Digite seu email" required>

            <p>Senha</p>
            <input type="password" placeholder="Digite sua senha" required maxlength="150">

            <p>Confirmar senha</p>
            <input type="text" placeholder="Confirme sua senha" required>

            <p>Nome</p>
            <input type="text" placeholder="Digite seu nome" required>

            <p>Sobrenome</p>
            <input type="text" placeholder="Digite seu sobrenome" required>

            <p>Data de nascimento</p>
            <input type="date" required>

            <p>RG</p>
            <input type="text" placeholder="Digite seu RG" required>

            <p>CPF</p>
            <input type="text" placeholder="Digite seu CPF" required>

            <p>Endereço</p>
            <input type="text" placeholder="Digite seu endereço" required>

            <p>País</p>
            <input type="text" placeholder="Digite seu país">

            <p>Estado</p>
            <input type="text" placeholder="Digite seu estado">

            <p>Cidade</p>
            <input type="text" placeholder="Digite sua cidade">

            <button type="submit" aria-required="true">
                <a href="../../index.html">Cadastrar</a>
            </button>
        </form>
    </main>
</body>

</html>
